title: Malware Download From a Raw IP Address, or Execute From a Temp Folder
id: bd101a2b-bd51-4626-afc6-9f1b8f1408bc
status: experimental
description: |
  Playbook step "Download and run". Every dropper seen on the honeypot fetched its
  payload from a raw IP address (no domain name) with wget, curl, tftp or ftpget, then
  made it executable with chmod and ran it from a temporary folder. Either half is
  suspicious on its own.
references:
  - https://timfletcher.tech/honeypot/
author: Timothy Fletcher
date: 2026-11-08
tags:
  - attack.command-and-control
  - attack.defense-evasion
  - attack.execution
  - attack.t1105
  - attack.t1222.002
  - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_downloader:
    CommandLine|contains:
      - 'wget '
      - 'curl '
      - 'tftp '
      - 'ftpget '
  selection_raw_ip:
    CommandLine|re: '(https?://|ftp://|\s)(\d{1,3}\.){3}\d{1,3}'
  selection_chmod:
    CommandLine|contains:
      - 'chmod 777'
      - 'chmod +x'
      - 'chmod 755'
  selection_temp_folder:
    CommandLine|contains:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm/'
      - '/var/run/'
  condition: (selection_downloader and selection_raw_ip) or (selection_chmod and selection_temp_folder)
falsepositives:
  - Installer scripts that download from an internal IP address
level: high
