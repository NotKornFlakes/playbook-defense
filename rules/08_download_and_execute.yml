title: Malware Download From a Raw IP Address, or Execute From a Temp Folder
id: bd101a2b-bd51-4626-afc6-9f1b8f1408bc
status: experimental
description: |
  Playbook step "Download and run". Every dropper seen on the honeypot fetched its
  payload from a raw IP address (no domain name) with wget, curl, tftp or ftpget. Most (18
  of the 23 download sessions from Nov 3 to Nov 10) then made it executable with chmod and
  ran it from a temporary folder; the other 5 piped a script straight into sh. Either half
  is suspicious on its own. Bots cd into the temporary folder first, so chmod usually names
  the file alone. selection_temp_cwd catches that from the process's working directory,
  which only works where the log source provides a CurrentDirectory field, as Sysmon for
  Linux does. With auditd, it has to be mapped from the CWD record.
references:
  - https://timfletcher.tech/honeypot/
author: Timothy Fletcher
date: 2026-11-08
modified: 2026-11-12
tags:
  - attack.command-and-control
  - attack.defense-impairment
  - attack.execution
  - attack.t1105
  - attack.t1222.002
  - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_downloader:
    CommandLine|contains:
      - 'wget '
      - 'curl '
      - 'tftp '
      - 'ftpget '
  selection_raw_ip:
    CommandLine|re: '(https?://|ftp://|\s|\s-[a-zA-Z])(\d{1,3}\.){3}\d{1,3}'
  selection_chmod:
    CommandLine|contains:
      - 'chmod 777'
      - 'chmod +x'
      - 'chmod 755'
  selection_temp_folder:
    CommandLine|contains:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm/'
      - '/var/run/'
  selection_temp_cwd:
    CurrentDirectory|re: '^/(tmp|var/tmp|dev/shm|var/run)(/|$)'
  condition: (selection_downloader and selection_raw_ip) or (selection_chmod and (selection_temp_folder or selection_temp_cwd))
falsepositives:
  - Installer scripts that download from an internal IP address
  - Installers that unpack into /tmp and make what they unpacked executable
level: high
